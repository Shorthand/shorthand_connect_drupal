# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost drupal.local;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost drupal.local;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/dylan.crt;
    ssl_certificate_key /etc/nginx/ssl/dylan.key;
    
    # Additional SSL security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Document root - pointing to Drupal's web directory
    root /opt/drupal/web;
    index index.php index.html index.htm;

    # Logs
    access_log /var/log/nginx/drupal-access.log;
    error_log /var/log/nginx/drupal-error.log;

    # Security - Hide nginx version
    server_tokens off;

    # Drupal specific configuration
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to scripts in site files directory
    location ~ ^/sites/.*/files/.*\.php$ {
        deny all;
    }

    # Private files
    location ~ ^/sites/.*/private/ {
        internal;
    }

    # Block access to scripts in site files directory
    location ~ ^/sites/[^/]+/files/.*\.php$ {
        deny all;
    }

    # Allow "Well-Known URIs" as per RFC 5785
    location ~* ^/.well-known/ {
        allow all;
    }

    # Block access to "hidden" files and directories
    location ~ (^|/)\. {
        return 403;
    }

    # Try to serve file directly, fallback to index.php
    location / {
        try_files $uri /index.php?$query_string;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?q=$1;
    }

    # Don't allow direct access to PHP files in the vendor directory
    location ~ /vendor/.*\.php$ {
        deny all;
        return 404;
    }

    # Protect files and directories from prying eyes
    location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|/(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config)$|/#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
        deny all;
        return 404;
    }

    # PHP-FPM configuration
    location ~ '\.php$|^/update.php' {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        
        # Security note: If you're running a version of PHP older than the
        # latest 8.x, you should have "cgi.fix_pathinfo = 0;" in php.ini
        # See http://serverfault.com/q/627903 for details.
        
        include fastcgi_params;
        
        # Block httpoxy attacks. See https://httpoxy.org/.
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;
        
        # PHP-FPM upstream
        fastcgi_pass drupal:9000;
        
        # Development settings - disable cache
        fastcgi_cache off;
        # For production, enable cache:
        # fastcgi_cache DRUPAL;
        # fastcgi_cache_valid 200 60m;
        
        # Increase timeouts for development
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        
        # Buffer settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }

    # Fighting with Styles? This little gem is amazing.
    location ~ ^/sites/.*/files/styles/ {
        try_files $uri @rewrite;
    }

    # Handle private files through Drupal. Private files's path can come
    # with a language prefix.
    location ~ ^(/[a-z\-]+)?/system/files/ {
        try_files $uri /index.php?$query_string;
    }

    # Enforce clean URLs
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri @rewrite;
        expires max;
        log_not_found off;
        add_header Cache-Control "public, immutable";
    }

    # RSS feed support
    location ~* \.(?:rss|atom)$ {
        expires 1h;
    }

    # Security headers for static content
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|ttf|ttc|otf|eot|woff|woff2)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # CSS and Javascript
    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}