# Schema for the configuration files of the shorthand module.

shorthand.settings:
  type: config_object
  label: 'Shorthand settings'
  mapping:
    shorthand_token:
      type: string
      label: 'Shorthand API token'
    request_timeout:
      type: integer
      label: 'Shorthand request timeout'
    input_format:
      type: string
      label: 'Text field format'
    file_stream_wrapper:
      type: string
      label: 'File stream wrapper'
