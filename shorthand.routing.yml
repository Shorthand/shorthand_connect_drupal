shorthand.settings_form:
  path: 'admin/config/services/shorthand'
  defaults:
    _form: '\Drupal\shorthand\Form\ShorthandSettingsForm'
    _title: 'Shorthand settings'
  requirements:
    _permission: 'administer shorthand'

shorthand.remote_collection:
  path: '/admin/content/shorthand'
  defaults:
    _controller: '\Drupal\shorthand\Controller\RemoteCollectionController::list'
    _title: 'Shorthand (remote)'
  requirements:
    _permission: 'access shorthand story overview'

shorthand.download.story:
  path: '/admin/content/shorthand/download/{storyid}'
  defaults:
    _controller: '\Drupal\shorthand\Controller\RemoteCollectionController::downloadStory'
    _title: 'Download shorthand story'
  requirements:
    _permission: 'download shorthand content'
    _csrf_token: 'TRUE'
  options:
    _admin_route: TRUE

shorthand.delete.story_version:
  path: '/admin/content/shorthand/delete/{storyid}/{version}'
  defaults:
    _controller: '\Drupal\shorthand\Controller\RemoteCollectionController::deleteStoryVersion'
    _title: 'Delete shorthand story version'
  requirements:
    _permission: 'delete shorthand content'
    _csrf_token: 'TRUE'
  options:
    _admin_route: TRUE

shorthand.delete.unused_versions:
  path: '/admin/content/shorthand/delete-unused'
  defaults:
    _form: '\Drupal\shorthand\Form\DeleteUnusedVersionsConfirmForm'
    _title: 'Delete unused shorthand versions'
  requirements:
    _permission: 'delete shorthand content'
  options:
    _admin_route: TRUE

shorthand.manage_story_versions:
  path: '/admin/content/shorthand/versions/{storyid}'
  defaults:
    _form: '\Drupal\shorthand\Form\StoryVersionsDeleteForm'
    _title: 'Manage shorthand versions'
  requirements:
    _permission: 'delete shorthand content'
    _csrf_token: 'TRUE'
  options:
    _admin_route: TRUE
