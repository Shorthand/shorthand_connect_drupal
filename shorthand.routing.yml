shorthand.settings_form:
  path: 'admin/config/services/shorthand'
  defaults:
    _form: '\Drupal\shorthand\Form\ShorthandSettingsForm'
    _title: 'Shorthand settings'
  requirements:
    _permission: 'administer shorthand'

shorthand.remote_collection:
  path: '/admin/content/shorthand'
  defaults:
    _controller: '\Drupal\shorthand\Controller\RemoteCollectionController::list'
    _title: 'Shorthand (remote)'
  requirements:
    _permission: 'access shorthand story overview'

shorthand.download.story:
  path: '/admin/content/shorthand/download/{storyid}'
  defaults:
    _controller: '\Drupal\shorthand\Controller\RemoteCollectionController::downloadStory'
    _title: 'Download shorthand story'
  requirements:
    _permission: 'download shorthand content'
    _csrf_token: 'TRUE'
  options:
    _admin_route: TRUE

shorthand.story_autocomplete:
  path: '/admin/content/shorthand/autocomplete'
  defaults:
    _controller: '\Drupal\shorthand\Controller\StoryAutocompleteController::stories'
  requirements:
    _permission: 'access shorthand story overview'
  options:
    _admin_route: TRUE

shorthand.local_story_autocomplete:
  path: '/admin/content/shorthand/local-autocomplete'
  defaults:
    _controller: '\Drupal\shorthand\Controller\LocalStoryController::autocomplete'
  requirements:
    _permission: 'access shorthand story overview'
  options:
    _admin_route: TRUE

shorthand.local_story_detail:
  path: '/admin/content/shorthand/local-story/{story_id}'
  defaults:
    _controller: '\Drupal\shorthand\Controller\LocalStoryController::detail'
  requirements:
    _permission: 'access shorthand story overview'
    story_id: '[^/]+'
  options:
    _admin_route: TRUE

shorthand.local_story_preview:
  path: '/admin/content/shorthand/local-story/{story_id}/{version_id}/preview'
  defaults:
    _controller: '\Drupal\shorthand\Controller\LocalStoryController::preview'
  requirements:
    _permission: 'access shorthand story overview'
    story_id: '[^/]+'
    version_id: '[^/]+'
  options:
    _admin_route: TRUE

shorthand.local_thumbnail:
  path: '/admin/content/shorthand/local-thumbnail/{story_id}/{version_id}'
  defaults:
    _controller: '\Drupal\shorthand\Controller\LocalThumbnailController::thumbnail'
  requirements:
    _permission: 'access shorthand story overview'
    story_id: '[^/]+'
    version_id: '[^/]+'
  options:
    _admin_route: TRUE
